<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="./Art4Eva.png" type="image/png">
<link rel="shortcut icon" href="./Art4Eva.png" type="image/png">
<link rel="apple-touch-icon" href="./Art4Eva.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The ArtNart Gallery</title>
<meta name="version" content="1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:light dark;--bg:#f1f8f2;--sf:#fff;--tx:#14261a;--mu:#587060;--g:#1f8a4c;--gd:#146b3a;--gl:#dcefe2;--bd:#cde2d3;--rd:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a11;--sf:#16271c;--tx:#e6f2e9;--mu:#9bb5a2;--g:#3fbf72;--gd:#2e9e5a;--gl:#1d3a27;--bd:#2a4634;--rd:#ff7b6b}}
:root[data-theme="dark"]{--bg:#0d1a11;--sf:#16271c;--tx:#e6f2e9;--mu:#9bb5a2;--g:#3fbf72;--gd:#2e9e5a;--gl:#1d3a27;--bd:#2a4634;--rd:#ff7b6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--g);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:1.2rem;margin:0;flex:1}
main{max-width:980px;margin:0 auto;padding:16px}
h2{color:var(--g);margin:24px 0 10px}
button{font:inherit;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:8px 14px;border-radius:10px;cursor:pointer}
button.pri{background:var(--g);color:#fff;border-color:var(--g);font-weight:600}
button.pri:disabled{opacity:.5}button.dng{color:var(--rd)}
header select{width:auto;margin:0;padding:7px 8px;background:#ffffff26;color:#fff;border-color:#ffffff55}header option{color:#000}
header button{background:#ffffff26;color:#fff;border-color:#ffffff55}
input,textarea,select{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:3px 0 10px}
label{display:block;font-size:.85rem;color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.grid img,.ph{width:100%;aspect-ratio:16/10;object-fit:contain;background:var(--gl);display:block}
.ph{background:linear-gradient(135deg,var(--gl),var(--g));display:grid;place-items:center;font-size:2rem}
.cb{padding:12px}.cb h3{margin:0}.by{color:var(--mu);font-size:.9rem}
.price{color:var(--g);font-weight:700;font-size:1.1rem}
.tag{display:inline-block;background:var(--gl);color:var(--gd);border-radius:20px;padding:1px 9px;font-size:.78rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stage{position:relative;display:grid;place-items:center;overflow:hidden;padding:6px 0 14px}
.pt{color:var(--g);font-size:1.6rem;line-height:1;z-index:2}
.wheel{position:relative;border-radius:50%;background:radial-gradient(circle,var(--gl) 0,var(--sf) 70%);border:3px solid var(--g);transition:transform 3.6s cubic-bezier(.15,.8,.2,1);max-width:100%}
.tile{position:absolute;left:50%;top:50%;width:64px;height:64px;padding:0;border-radius:50%;overflow:hidden;border:3px solid var(--g);transition:transform 3.6s cubic-bezier(.15,.8,.2,1)}
.tile img,.tile .ph{width:100%;height:100%;aspect-ratio:1;font-size:1.2rem}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#ov{position:fixed;inset:0;background:#000a;display:none;z-index:20;overflow:auto;padding:16px}
#ov .m{max-width:640px;margin:20px auto;background:var(--sf);border-radius:16px;padding:18px;border:1px solid var(--bd)}
.m img,.m video{width:100%;border-radius:10px;margin-bottom:8px}
.bell{position:relative}.bd{background:var(--rd);color:#fff;border-radius:10px;padding:0 6px;font-size:.75rem;margin-left:4px}
.note{border-left:4px solid var(--g);padding:8px 12px;margin:8px 0;background:var(--sf);border-radius:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--gd);color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:30;max-width:90%}
.clk{cursor:pointer}.thumbs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.th{flex:none;width:64px;height:48px;padding:0;overflow:hidden;border-radius:8px;border:2px solid var(--bd)}.th.on{border-color:var(--g)}.th img,.th .ph{width:100%;height:100%;margin:0;border-radius:0;aspect-ratio:auto;font-size:1.1rem}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}.facts div{background:var(--gl);border-radius:10px;padding:8px 10px}.facts span{display:block;font-size:.75rem;color:var(--mu)}
.muted{color:var(--mu)}.err{color:var(--rd)}
.car{display:flex;align-items:center;gap:6px}
.track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;flex:1;min-width:0;scrollbar-width:none;padding:4px 2px}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 min(260px,76%);scroll-snap-align:start}
.slide img,.slide .ph{width:100%;aspect-ratio:16/10;height:auto;object-fit:contain;background:var(--gl);display:block}
.m img,.m video{max-height:60vh;object-fit:contain;background:var(--bg)}
.nav{flex:none;width:40px;height:40px;border-radius:50%;padding:0;font-size:1.5rem;line-height:1;background:var(--g);color:#fff;border-color:var(--g)}
.hero{position:relative}.hero .track{gap:0;padding:0;border-radius:16px}.hero .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3}.nav.l{left:8px}.nav.r{right:8px}
.hslide{flex:0 0 100%;scroll-snap-align:start;position:relative;height:clamp(260px,50vw,460px);overflow:hidden;cursor:pointer;background:var(--gl)}
.hbg{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(22px) brightness(.85)}
.hfg{position:relative;width:100%;height:100%;object-fit:contain;display:block}.hslide .ph{aspect-ratio:auto;height:100%}
.cap{position:absolute;left:0;right:0;bottom:0;padding:44px 64px 14px;color:#fff;background:linear-gradient(transparent,#000c)}.cap h2{margin:0;color:#fff}.cap .tag{margin-top:6px}
.dots{display:flex;justify-content:center;gap:9px;margin:12px 0 4px}.dot{width:12px;height:12px;border-radius:50%;padding:0;border:none;background:var(--bd)}.dot.on{background:var(--g);transform:scale(1.3)}
</style></head><body>
<header><h1>🎨 The ArtNart Gallery</h1><span id="sync" style="font-size:.8rem"></span>
<button id="bellB" class="bell" style="display:none" onclick="document.getElementById('adm').scrollIntoView()">🔔<span id="bn" class="bd">0</span></button>
<select id="langS" onchange="setLang(this.value)" aria-label="Language"><option value="en">English</option><option value="pl">Polski</option></select>
<select id="curS" onchange="setCur(this.value)" aria-label="Currency"><option>GBP</option><option>USD</option><option>PLN</option></select>
<button id="loginB" onclick="loginM()">Admin login</button></header>
<main>
<p class="muted">Original artwork, sold by auction only. Browse the collection, find a piece you love, and place your bid before the clock runs out.</p>
<h2>Featured pieces</h2>
<div class="hero"><button class="nav l" onclick="slide(-1)" aria-label="Previous">‹</button><div id="wheelBox" class="track"></div><button class="nav r" onclick="slide(1)" aria-label="Next">›</button></div>
<div id="dots" class="dots"></div>
<h2>All pieces</h2>
<div class="row" style="margin-bottom:12px"><input id="q" placeholder="🔍 Search title or artist" oninput="rGrid()" style="flex:1;min-width:150px;margin:0"><select id="flt" onchange="rGrid()" style="width:auto;margin:0"><option value="all">All</option><option value="live">Live auctions</option><option value="ended">Ended</option><option value="fav">♥ Favourites</option></select><select id="srt" onchange="rGrid()" style="width:auto;margin:0"><option value="end">Ending soon</option><option value="new">Newest</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option></select></div><div id="grid" class="grid"></div>
<section id="adm" style="display:none"><h2>Admin board</h2><div id="stats" class="facts"></div><div id="notes"></div>
<div class="row"><h2 style="margin:10px 0">Pieces</h2><button class="pri" onclick="editArt()">+ New piece</button></div><div id="alist" class="grid"></div></section>
<footer class="muted" style="text-align:center;padding:24px 0 12px;font-size:.85rem">The ArtNart Gallery · v1.0</footer>
</main>
<input type="file" id="quick" accept="image/*" style="display:none">
<div id="ov"></div><div id="toast"></div>
<script>
const SB_URL="https://mvjmbegwqkxinpqtacug.supabase.co",SB_KEY="sb_publishable_G5tTq6z-Hypg9Oj3_Ls4eg_wuUxZXIw";
let db=null,assets=null,arts=[],bids=[],ships=[],admin=false,ang=0,cur=null,seenEnd={};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^(https?:\/\/|\/_blob\/|data:image\/)/.test(u||"")?u:"";
const topBid=a=>bids.filter(b=>b.art===a.id).sort((x,y)=>y.amount-x.amount||x.at-y.at)[0];
const price=a=>{const t=topBid(a);return t?t.amount:Number(a.start||0)};
const ended=a=>Date.now()>=a.endsAt;
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",3500)};
const pic=(u,e)=>safe(u)?`<img src="${esc(safe(u))}" alt="">`:`<div class="ph">🖼️</div>`;
const lt=ms=>new Date(ms-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
function left(ms){let s=Math.max(0,Math.floor((ms-Date.now())/1e3));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+"d ":"")+h+(lang==="pl"?"g ":"h ")+m+"m "+s%60+"s"}
const cd=a=>ended(a)?`<span class="tag">Ended</span>`:`⏳ <span data-end="${a.endsAt}">${left(a.endsAt)}</span>`;

const CUR={GBP:{p:"\u00a3",r:1},USD:{p:"$",r:1.32},PLN:{s:" z\u0142",r:4.87}}; // base currency is GBP: 1 GBP = r units
let cc="GBP";try{cc=localStorage.getItem("cur")||"GBP"}catch(e){}if(!CUR[cc])cc="GBP";$("#curS").value=cc;
function fmt(v){const c=CUR[cc];return(c.p||"")+(Math.round(v*c.r*100)/100).toLocaleString(lang==="pl"?"pl":"en",{maximumFractionDigits:2})+(c.s||"")}
async function rates(){try{const r=await fetch("https://open.er-api.com/v6/latest/GBP"),j=await r.json();if(j.rates&&j.rates.USD&&j.rates.PLN){CUR.USD.r=j.rates.USD;CUR.PLN.r=j.rates.PLN;render()}}catch(e){}}
rates();setInterval(rates,36e5);
function setCur(v){cc=v;try{localStorage.setItem("cur",v)}catch(e){}closeM();render()}
let sb=null;
async function save(c,id,d,upd){
  if(!sb)return toast("Add your Supabase keys first");
  let r;
  if(upd){const o=(c==="art"?arts:c==="ship"?ships:bids).find(x=>x.id===id)||{};const{id:_i,confirmed:_c,...rest}=o;r=await sb.from(c).update({data:{...rest,...d}}).eq("id",id)}
  else r=await sb.from(c).insert({id,data:d});
  if(r.error)toast("Could not save: "+r.error.message);else load();
}
async function del(c,id){if(!sb)return;const r=await sb.from(c).delete().eq("id",id);if(r.error)toast("Could not delete: "+r.error.message);else load()}
const rows=r=>(r.data||[]).map(x=>({id:x.id,...x.data}));
async function load(){
  const[a,b,s2,c]=await Promise.all(["art","bids","ship","confirmed"].map(t=>sb.from(t).select("*")));
  const conf=new Set((c.data||[]).map(x=>x.id));
  arts=rows(a);arts.forEach(x=>x.confirmed=conf.has(x.id));bids=rows(b);ships=rows(s2);render();
}
async function init(){
  if(SB_URL.startsWith("PASTE")){$("#sync").textContent="Setup needed: add Supabase keys";render();return}
  sb=supabase.createClient(SB_URL,SB_KEY);assets=true;
  const{data}=await sb.auth.getSession();admin=!!data.session;
  sb.auth.onAuthStateChange((_e,ss)=>{const n=!!ss;if(n!==admin){admin=n;load()}});
  await load();
  sb.channel("live").on("postgres_changes",{event:"*",schema:"public"},()=>load()).subscribe(st=>{if(st==="SUBSCRIBED")$("#sync").textContent="● live"});
  setInterval(load,30000);
}
function render(){rWheel();rGrid();rAdmin()}

let hi=0,ap,hov=false;
const feats=()=>arts.filter(a=>a.feat);
function rWheel(){
  const b=$("#wheelBox"),L=feats();$("#dots").innerHTML="";
  if(!L.length){b.innerHTML=`<div class="hslide" style="cursor:default;height:180px;display:grid;place-items:center"><p class="muted">No featured pieces yet \u2014 the artist will pick some soon. \ud83c\udf31 Scroll down to see everything.</p></div>`;return}
  if(hi>=L.length)hi=0;
  b.innerHTML=L.map(a=>{const u=safe(a.cover||a.img),cu=encodeURI(u).replace(/\(/g,"%28").replace(/\)/g,"%29");return`<div class="hslide" onclick="view('${a.id}')">${u?`<div class="hbg" style="background-image:url(${esc(cu)})"></div><img class="hfg" src="${esc(u)}" alt="">`:`<div class="ph hfg">\ud83d\uddbc\ufe0f</div>`}<div class="cap"><h2>${esc(a.title)}</h2><div>by ${esc(a.by)}</div><div><b>${ended(a)?"Final bid":"Current bid"}: ${fmt(price(a))}</b> \u00b7 ${cd(a)}</div><span class="tag">View details \u2192</span></div></div>`}).join("");
  $("#dots").innerHTML=L.map((a,k)=>`<button class="dot${k===hi?" on":""}" onclick="goF(${k})" aria-label="Featured piece ${k+1}"></button>`).join("");
  b.scrollLeft=hi*b.clientWidth;
}
function dotsOn(){document.querySelectorAll(".dot").forEach((d,k)=>d.classList.toggle("on",k===hi))}
function goF(k){const b=$("#wheelBox");hi=k;b.scrollTo({left:k*b.clientWidth,behavior:"smooth"});dotsOn();auto()}
function slide(d){const n=feats().length;if(n)goF((hi+d+n)%n)}
function auto(){clearInterval(ap);ap=setInterval(()=>{if(!hov&&feats().length>1&&!$("#ov").innerHTML)slide(1)},15000)}
$("#wheelBox").addEventListener("scroll",()=>{const b=$("#wheelBox"),k=Math.round(b.scrollLeft/(b.clientWidth||1));if(k!==hi&&k<feats().length){hi=k;dotsOn()}});
$(".hero").onmouseenter=()=>hov=true;$(".hero").onmouseleave=()=>hov=false;auto();
let fav=[];try{fav=JSON.parse(localStorage.getItem("fav")||"[]")}catch(e){}
function togFav(id){fav=fav.includes(id)?fav.filter(x=>x!==id):[...fav,id];try{localStorage.setItem("fav",JSON.stringify(fav))}catch(e){}rGrid()}
function rGrid(){
  const q=$("#q").value.trim().toLowerCase(),f=$("#flt").value,o=$("#srt").value;
  const L=arts.filter(a=>(!q||(a.title+" "+a.by).toLowerCase().includes(q))&&(f==="all"||(f==="live"&&!ended(a))||(f==="ended"&&ended(a))||(f==="fav"&&fav.includes(a.id))));
  L.sort(o==="end"?(x,y)=>(ended(x)-ended(y))||x.endsAt-y.endsAt:o==="new"?(x,y)=>(y.created||0)-(x.created||0):o==="lo"?(x,y)=>price(x)-price(y):(x,y)=>price(y)-price(x));
  $("#grid").innerHTML=L.length?L.map(a=>{const soon=!ended(a)&&a.endsAt-Date.now()<864e5,nb=bids.filter(b=>b.art===a.id).length;
  return`<div class="card"><div class="clk" onclick="view('${a.id}')">${pic(a.cover||a.img)}</div><div class="cb"><h3 class="clk" onclick="view('${a.id}')">${esc(a.title)}</h3><div class="by">by ${esc(a.by)} ${a.video||a.vids?'<span class="tag">\u25b6 video</span>':""} ${soon?'<span class="tag">\ud83d\udd25 ending soon</span>':""}</div><div class="price">${fmt(price(a))}</div><div class="by">${cd(a)} \u00b7 ${nb?nb+" bid(s)":"no bids yet"}</div><div class="row" style="margin-top:8px"><button class="pri" onclick="view('${a.id}')">${ended(a)?"View":"Buy / Bid"}</button><button onclick="togFav('${a.id}')" aria-label="Favourite">${fav.includes(a.id)?"\u2665":"\u2661"}</button></div></div></div>`}).join(""):`<p class="muted">Nothing matches.</p>`;
}
function modal(h){const o=$("#ov");o.innerHTML=`<div class="m">${h}</div>`;o.style.display="block"}
function closeM(){$("#ov").style.display="none";$("#ov").innerHTML=""}
let _md=[];
const lines=t=>String(t||"").split(/\n/).map(x=>x.trim()).filter(Boolean);
function mediaHtml(m){return m?(m.t==="v"?`<video controls playsinline src="${esc(m.u)}"></video>`:`<img src="${esc(m.u)}" alt="">`):`<div class="ph">\ud83d\uddbc\ufe0f</div>`}
function showM(i){$("#big").innerHTML=mediaHtml(_md[i]);document.querySelectorAll(".th").forEach((b,j)=>b.classList.toggle("on",j===i))}
function view(id){
  const a=arts.find(x=>x.id===id);if(!a)return;
  const hist=bids.filter(b=>b.art===id).sort((x,y)=>y.amount-x.amount).slice(0,8);
  _md=[];[a.img,...lines(a.imgs)].forEach(u=>safe(u)&&_md.push({t:"i",u}));[a.video,...lines(a.vids)].forEach(u=>safe(u)&&_md.push({t:"v",u}));
  if(!_md.length&&safe(a.cover))_md.push({t:"i",u:a.cover});
  const th=_md.length>1?`<div class="thumbs">${_md.map((x,i)=>`<button class="th${i?"":" on"}" onclick="showM(${i})" aria-label="Media ${i+1}">${x.t==="v"?'<div class="ph">\u25b6</div>':`<img src="${esc(x.u)}" alt="">`}</button>`).join("")}</div>`:"";
  const nb=bids.filter(b=>b.art===id).length;
  modal(`<div id="big">${mediaHtml(_md[0])}</div>${th}
  <h3 style="margin:4px 0">${esc(a.title)}</h3><div class="by">by ${esc(a.by)}</div>
  <p style="white-space:pre-wrap">${esc(a.desc)||"No description yet."}</p>
  <div class="facts"><div><span>Starting bid</span><b>${fmt(a.start||0)}</b></div><div><span>${ended(a)?"Final bid":"Current bid"}</span><b>${fmt(price(a))}</b></div><div><span>Bids</span><b>${nb}</b></div><div><span>${ended(a)?"Ended":"Ends"}</span><b>${esc(new Date(a.endsAt).toLocaleString(lang==="pl"?"pl-PL":undefined))}</b></div></div>
  <p>${cd(a)}${_md.length>1?` \u00b7 ${_md.filter(x=>x.t==="i").length} picture(s), ${_md.filter(x=>x.t==="v").length} video(s)`:""}</p>
  ${hist.length?`<p class="by">Bids: ${hist.map(h=>esc(h.name)+" "+fmt(h.amount)).join(" \u00b7 ")}</p>`:""}
  ${ended(a)?`<p><b>This auction has ended.</b></p>${claimHtml(a)}`:`<label>Your name<input id="b_n" autocomplete="name"></label><label>Class<input id="b_c"></label><label>Country<select id="b_k"><option value="">Choose\u2026</option><option value="Poland">Poland</option><option value="United Kingdom">United Kingdom</option></select></label>
  <label>Your bid (${cc}) \u2014 must beat ${fmt(price(a))}<input id="b_a" type="number" inputmode="decimal" min="0" step="any"></label><p id="b_e" class="err"></p>
  <button class="pri" onclick="bid('${a.id}')">Place bid</button> `}<button onclick="closeM()">Close</button>`);
}
function bid(id){
  const a=arts.find(x=>x.id===id),n=$("#b_n").value.trim(),c=$("#b_c").value.trim(),k=$("#b_k").value,v=Math.round(Number($("#b_a").value)/CUR[cc].r*100)/100,e=$("#b_e");
  if(!a||ended(a)){e.textContent="Sorry, this auction just ended.";return}
  if(!n||!c||!k){e.textContent="Please enter your name, class and country.";return}
  if(!(v>price(a))){e.textContent="Your bid must be higher than "+fmt(price(a))+".";return}
  save("bids","b"+Date.now()+Math.random().toString(36).slice(2,6),{art:id,name:n,cls:c,cty:k,amount:v,at:Date.now()});
  closeM();toast("Bid placed: "+fmt(v)+" on “"+a.title+"”");
}

/* ---------- admin ---------- */
function loginM(){
  if(admin){sb&&sb.auth.signOut();return}
  modal(`<h3>Admin login</h3><label>Username<input id="l_u" autocomplete="username"></label><label>Password<input id="l_p" type="password" autocomplete="current-password"></label><p id="l_e" class="err"></p>
  <button class="pri" onclick="login()">Log in</button> <button onclick="closeM()">Cancel</button>`);
}
async function login(){
  if(!sb){$("#l_e").textContent="Site not connected to Supabase yet.";return}
  const r=await sb.auth.signInWithPassword({email:$("#l_u").value.trim().toLowerCase()+"@artnart.gallery",password:$("#l_p").value});
  if(r.error)$("#l_e").textContent="Wrong username or password.";else{admin=true;closeM();load();$("#adm").scrollIntoView()}
}
function rAdmin(){
  $("#adm").style.display=admin?"block":"none";$("#loginB").textContent=admin?"Log out":"Admin login";
  const fresh=arts.filter(a=>ended(a)&&!a.seen);$("#bellB").style.display=admin?"inline-block":"none";$("#bn").textContent=fresh.length;
  if(!admin)return;

function rm(id){const a=arts.find(x=>x.id===id);if(!a)return;modal(`<h3>Delete “${esc(a.title)}”?</h3><p>This also removes its bids and can’t be undone.</p><button class="dng" onclick="rmGo('${id}')">Yes, delete</button> <button onclick="closeM()">Cancel</button>`)}

async function uploadFile(f){
